[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly"
dynamic = ["version"]
description = "A desktop fly driven by the real FlyWire Drosophila connectome — 139k neurons buzzing over your desktop (Linux, macOS and Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Rembish", email = "alex@rembish.org" }]
keywords = ["connectome", "drosophila", "flywire", "desktop-pet", "neuroscience", "simulation"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Desktop Environment",
]

# numpy and pycairo are needed everywhere (every backend draws the sprite
# with cairo). PyGObject is Linux-only and is best installed from your
# distribution (python3-gi, python3-gi-cairo, gir1.2-gtk-3.0); building it
# via pip needs GTK C headers. macOS pulls PyObjC; Windows needs nothing
# extra — its backend is pure ctypes.
dependencies = [
    "numpy>=1.24",
    "pycairo>=1.20",
    "PyGObject>=3.42; sys_platform == 'linux'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
fruitfly = "fruitfly.__main__:main"

[project.urls]
Homepage = "https://github.com/rembish/fruit-fly"
Repository = "https://github.com/rembish/fruit-fly"
Issues = "https://github.com/rembish/fruit-fly/issues"

[tool.setuptools]
packages = ["fruitfly", "fruitfly.ui"]

# One source of truth for the version: fruitfly/__init__.py
[tool.setuptools.dynamic]
version = { attr = "fruitfly.__version__" }

[project.optional-dependencies]
# pytest collects the fast checks; the slower suites in tests/ are also
# runnable directly as scripts, which is how the ones needing the
# connectome are meant to be run. See tests/README or `## Tests` below.
dev = ["ruff>=0.5", "mypy>=1.8", "pytest>=7", "coverage>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: drives the whole simulation and needs data/brain.npz",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PL"]
ignore = [
    "PLR0913",  # many arguments: the tuning knobs are the point
    "PLR2004",  # magic values: biological constants read better inline
    "PLR0912",  # branches: the motor state machine is one honest chain
    "PLR0915",  # statements, same
    "PLR0917",  # positional args: the four connectome arrays travel
                # together everywhere, and splitting them up to please a
                # counter would obscure that they are one thing
]

[tool.ruff.lint.per-file-ignores]
# backends bind platform APIs that only exist on their own platform
"fruitfly/ui/cocoa.py" = ["F821", "N802"]
"fruitfly/ui/win32.py" = ["N802", "F821"]
"tests/*" = ["E402"]          # sys.path setup must precede imports

[tool.mypy]
python_version = "3.10"
files = ["fruitfly"]
ignore_missing_imports = true      # gi, objc, AppKit, Quartz, cairo
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# platform backends are only type-checkable on their own platform
module = ["fruitfly.ui.cocoa", "fruitfly.ui.win32", "fruitfly.ui.gtk"]
warn_unused_ignores = false
