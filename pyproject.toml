[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly"
version = "0.1.0"
description = "A desktop fly driven by the real FlyWire Drosophila connectome — 139k neurons buzzing over your desktop (Linux/GTK and macOS/Cocoa)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Rembish", email = "alex@rembish.org" }]
keywords = ["connectome", "drosophila", "flywire", "desktop-pet", "neuroscience", "simulation"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Environment :: MacOS X :: Cocoa",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Desktop Environment",
]

# numpy and pycairo are needed everywhere (the sprite is drawn with cairo
# on both backends). PyGObject is Linux-only and is best installed from
# your distribution (python3-gi, python3-gi-cairo, gir1.2-gtk-3.0);
# building it via pip needs GTK C headers. macOS pulls PyObjC instead.
dependencies = [
    "numpy>=1.24",
    "pycairo>=1.20",
    "PyGObject>=3.42; sys_platform == 'linux'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
fruitfly = "fruitfly.__main__:main"

[project.urls]
Homepage = "https://github.com/rembish/fruit-fly-linux"

[tool.setuptools]
packages = ["fruitfly", "fruitfly.ui"]
