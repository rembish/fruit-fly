worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Cloud Run terminates TLS and hands us plain HTTP on $PORT, which is
  # 8080 by contract.
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOT /healthz: the Google Front End reserves that path on Cloud Run
    # and the container never sees it.
    location = /ping {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # `always`, or they vanish from error responses — which are exactly
    # the ones an attacker is trying to provoke.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # worker-src 'self' is not decoration and is missing from the config
    # this borrows from: the brain runs in a Web Worker, and without this
    # directive the page loads, shows its loading bar, and never starts a
    # fly. default-src does not cover workers in every engine.
    add_header Content-Security-Policy
      "default-src 'self'; worker-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml text/markdown;
    # brain.bin is pre-compressed at build time — 17 MB is far too much to
    # gzip on every request, and it never changes.
    gzip_static       on;

    # Hashed by Vite, so they can be cached forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # The connectome. Immutable for a day rather than a year: it is not
    # content-hashed in the URL, so a re-export needs to be reachable
    # without waiting out a year of CDN cache.
    location /brain/ {
      add_header Cache-Control "public, max-age=86400" always;
      add_header Access-Control-Allow-Origin "*" always;
      types { application/octet-stream bin; application/json json; text/markdown md; }
      try_files $uri =404;
    }

    # Multi-page: /fff/ and /bench/ are real directories with real
    # index.html files, so this is a plain static lookup and not an SPA
    # fallback. A missing path should 404, not silently serve the hub.
    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ $uri/index.html =404;
    }
  }
}
