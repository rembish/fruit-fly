name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an in-flight run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for PyGObject and pycairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev gir1.2-gtk-3.0
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev \
            || sudo apt-get install -y --no-install-recommends \
                 libgirepository1.0-dev
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    # Also a check on the install instructions: macOS needs Homebrew cairo
    # because pycairo ships no wheel for it, and Windows needs nothing.
    name: tests ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev gir1.2-gtk-3.0 xvfb
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev \
            || sudo apt-get install -y --no-install-recommends \
                 libgirepository1.0-dev
      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkgconf
      - run: pip install -e ".[dev]"
      # No connectome here on purpose: the suite must be green on a fresh
      # clone, skipping what needs data/brain.npz rather than failing.
      - name: pytest (fast checks)
        if: runner.os != 'Linux'
        run: pytest -q -m "not slow"
      - name: pytest (fast checks, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q -m "not slow"

  full:
    # The suites that need the compiled brain: 62 MB of FlyWire tables,
    # cached so it is downloaded once rather than on every run.
    name: full suite with the connectome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev gir1.2-gtk-3.0 xvfb
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev \
            || sudo apt-get install -y --no-install-recommends \
                 libgirepository1.0-dev
      - uses: actions/cache@v6
        with:
          path: data
          # data.py compiles brain.npz, so a change to it invalidates the
          # compiled brain as well as the raw tables it was built from.
          key: connectome-${{ hashFiles('fruitfly/data.py') }}
      - run: pip install -e ".[dev]"
      - name: Fetch and compile the connectome if not cached
        run: python -m fruitfly prepare
      - run: xvfb-run -a coverage run --source=fruitfly -m pytest -q
      - run: coverage report
